<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wizard Academy</title>
  </head>
  <body>
    <div id="game"></div>

    <div id="hud" hidden>
      <div id="crosshair"></div>
      <div id="status"></div>
      <div id="help">WASD move &middot; Shift run &middot; Space jump &middot; Esc release mouse</div>
    </div>

    <div id="overlay">
      <div class="panel">
        <h1>Wizard Academy</h1>
        <form id="join-form">
          <label for="name">Wizard name</label>
          <input id="name" maxlength="16" pattern="[A-Za-z0-9 _\-]{1,16}" required autocomplete="off" />
          <button type="submit">Enter</button>
        </form>
        <p id="overlay-message"></p>
        <p id="resume-hint" hidden>Click to resume</p>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
